<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>football-cv · overlay</title>
<style>
  :root{ --primary:#2563eb; --ink:#0b1220; --paper:#0e1526; --card:#131c31;
         --slate:#94a3b8; --white:#f7f8fa; --offense:#2cd4d4; --defense:#e6b31e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--white);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;min-height:100vh}
  aside{width:300px;padding:24px;background:var(--paper);border-right:1px solid #1e293b;
        display:flex;flex-direction:column;gap:18px}
  h1{font-size:19px;margin:0}
  h1 span{color:#60a5fa}
  .sub{color:var(--slate);font-size:13px}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate)}
  .legend{display:flex;gap:16px}
  .item{display:flex;align-items:center;gap:8px;font-size:13px}
  .dot{width:14px;height:14px;border-radius:50%}
  .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{background:var(--card);border-radius:8px;padding:8px 0;text-align:center}
  .chip b{display:block;font-size:16px}.chip span{font-size:11px;color:var(--slate)}
  button{appearance:none;border:none;border-radius:10px;cursor:pointer;background:var(--primary);
         color:#fff;font-weight:600;font-size:14px;padding:12px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  video{max-width:100%;max-height:92vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #status{font-size:14px;text-align:center}
  a{color:#60a5fa}
</style>
</head>
<body>
<aside>
  <div><h1>football<span>-cv</span></h1><div class="sub">position overlay · <b id="play"></b></div></div>
  <div class="label">Legend</div>
  <div class="legend">
    <div class="item"><span class="dot" style="background:var(--offense)"></span>offense</div>
    <div class="item"><span class="dot" style="background:var(--defense)"></span>defense</div>
  </div>
  <div class="label">Counts</div>
  <div id="counts" class="counts"></div>
  <button id="rerender">Re-render overlay</button>
  <div class="sub"><a href="/calibrate.html">← re-calibrate</a></div>
</aside>
<main>
  <div id="status">rendering overlay… (this takes ~30–60s)</div>
  <video id="vid" controls playsinline style="display:none"></video>
</main>
<script>
const PLAY = new URLSearchParams(location.search).get("play") || "ohs005";
document.getElementById("play").textContent = PLAY;

async function loadCounts(){
  try{
    const p = await fetch(`/api/artifact/${PLAY}/positions.json`).then(r=>r.json());
    const order=["DL","LB","CB","S","OL","QB","RB","WR"], c={};
    Object.values(p).forEach(t=>c[t]=(c[t]||0)+1);
    document.getElementById("counts").innerHTML =
      order.map(k=>`<div class="chip"><b>${c[k]||0}</b><span>${k}</span></div>`).join("");
  }catch(e){}
}

async function render(){
  const st=document.getElementById("status"), vid=document.getElementById("vid");
  st.style.display="block"; st.textContent="rendering overlay… (this takes ~30–60s)"; vid.style.display="none";
  const res = await fetch(`/api/render/${PLAY}`,{method:"POST"}).then(r=>r.json()).catch(e=>({error:String(e)}));
  if(res.ok){
    st.style.display="none";
    vid.src = res.url + "?t=" + Date.now();   // cache-bust
    vid.style.display="block"; vid.play().catch(()=>{});
  } else {
    st.textContent = "render failed: " + (res.error || "?");
  }
}
document.getElementById("rerender").addEventListener("click", render);
loadCounts(); render();
</script>
</body>
</html>
