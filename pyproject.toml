[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "football-cv"
version = "0.1.0"
description = "Computer-vision pipeline for tracking and classifying football players from film"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "scipy"]

[project.optional-dependencies]
# Person detection (YOLO) pulls in torch and is only needed for the
# `detect`/`all` stages. The classifier and tests run without it.
detect = ["ultralytics"]
dev = ["pytest"]

[project.scripts]
football-cv = "footballcv.cli:main"

[tool.setuptools]
packages = ["footballcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
