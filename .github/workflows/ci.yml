name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Scrub (optional — pattern from a repo secret, never public)
        env:
          PATTERN: ${{ secrets.SCRUB_PATTERN }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "no SCRUB_PATTERN secret set — skipping scrub"; exit 0
          fi
          if grep -rIniE "$PATTERN" footballcv/ viewer/ examples/ tests/ docs/ README.md LICENSE pyproject.toml; then
            echo "SCRUB FAILED: forbidden term found"; exit 1
          fi
          echo "SCRUB OK"
